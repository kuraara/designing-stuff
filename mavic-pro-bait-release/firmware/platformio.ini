; PlatformIO build for the bait release controller (ESP32-C3 SuperMini).
;   cd firmware && pio run -t upload
; The sketch also opens as-is in the Arduino IDE (board "ESP32C3 Dev Module", USB CDC On Boot: Enabled).

[platformio]
src_dir = bait_release

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
